version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Zap.Gateway.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - identity-api
    networks:
      - zap-network

  identity-api:
    build:
      context: .
      dockerfile: services/Zap.Identity.Api/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Override appsettings.json settings for Docker
      - DatabaseSettings__DBProvider=mongodb
      - DatabaseSettings__ConnectionString=mongodb://mongodb:27017/?connectTimeoutMS=5000
      - DatabaseSettings__DatabaseName=SinglePoint_en
    depends_on:
      - mongodb
    networks:
      - zap-network

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017" # Exposed to host for debugging tools
    volumes:
      - mongodb_data:/data/db
    networks:
      - zap-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zap-network

  # Optional: Web-based MongoDB admin interface
  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
    depends_on:
      - mongodb
    networks:
      - zap-network

networks:
  zap-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
