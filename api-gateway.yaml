      summary: "Login endpoint"
      operationId: "login"
      x-google-backend:
        address: "https://zap-identity-api-882473783707.asia-southeast1.run.app/api/Auth/login"
        protocol: "h2"
        path_translation: CONSTANT_ADDRESS
      responses:
        200:
          description: "OK"
    options:
      summary: "CORS support"
      operationId: "cors_login"
      x-google-backend:
        address: "https://zap-identity-api-882473783707.asia-southeast1.run.app/api/Auth/login"
        protocol: "h2"
        path_translation: CONSTANT_ADDRESS
