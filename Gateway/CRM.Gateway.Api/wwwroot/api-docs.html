<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM CONNECT - HỆ THỐNG API 2026</title>
    <link rel="stylesheet" type="text/css"
        href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/4.15.5/swagger-ui.min.css">
    <style>
        html {
            box-sizing: border-box;
            overflow-y: scroll;
        }

        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }

        body {
            margin: 0;
            background: #fafafa;
        }

        .swagger-ui .topbar {
            background-color: #1b1b1b;
            padding: 10px 0;
        }
    </style>
</head>

<body>
    <div id="swagger-ui"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/4.15.5/swagger-ui-bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/4.15.5/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function () {
            const ui = SwaggerUIBundle({
                urls: [
                    { url: "/swagger/v1/swagger.json", name: "CRM GATEWAY CORE" },
                    { url: "/api/Auth/swagger/v1/swagger.json", name: "Authentication Service" },
                    { url: "/api/Employees/swagger/v1/swagger.json", name: "HR Service" },
                    { url: "/api/Customer/swagger/v1/swagger.json", name: "Customer Service" },
                    { url: "/api/Sales/swagger/v1/swagger.json", name: "Sales Service" },
                    { url: "/api/Products/swagger/v1/swagger.json", name: "Product Service" },
                    { url: "/api/Orders/swagger/v1/swagger.json", name: "Order Service" },
                    { url: "/api/Payments/swagger/v1/swagger.json", name: "Payment Service" },
                    { url: "/api/Organizations/swagger/v1/swagger.json", name: "Organization Service" },
                    { url: "/api/Reports/swagger/v1/swagger.json", name: "Report Service" },
                    { url: "/api/Promotions/swagger/v1/swagger.json", name: "Promotion Service" }
                ],
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                validatorUrl: null
            });
            window.ui = ui;
        };
    </script>
</body>

</html>
