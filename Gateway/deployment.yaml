apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-api
  template:
    metadata:
      labels:
        app: gateway-api
    spec:
      containers:
      - name: gateway-api
        image: ${REGISTRY_URL}/gateway-api:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-api-service
spec:
  type: LoadBalancer
  selector:
    app: gateway-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
