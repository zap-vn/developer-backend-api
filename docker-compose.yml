version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Zap.Gateway.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - identity-api
    networks:
      - zap-network

  identity-api:
    build:
      context: .
      dockerfile: services/Zap.Identity.Api/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDB__ConnectionString=mongodb://mongodb:27017
      - MongoDB__DatabaseName=ZapIdentity
    depends_on:
      - mongodb
    networks:
      - zap-network

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - zap-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zap-network

networks:
  zap-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
