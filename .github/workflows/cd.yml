# Triggering run to verify permissions
name: CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]

env:
  DOTNET_VERSION: '8.0.x'
  REGISTRY: ghcr.io
  
jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Lowercase repo name
      run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

    - name: Build and Push Gateway
      uses: docker/build-push-action@v5
      with:
        context: .
        file: gateway/Zap.Gateway.Api/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.REPO_LC }}/gateway:staging
          ${{ env.REGISTRY }}/${{ env.REPO_LC }}/gateway:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and Push Identity API
      uses: docker/build-push-action@v5
      with:
        context: .
        file: services/Zap.Identity.Api/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.REPO_LC }}/identity-api:staging
          ${{ env.REGISTRY }}/${{ env.REPO_LC }}/identity-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Deployment notification
    - name: Notify deployment
      run: |
        echo "🚀 Deployed to staging environment"
        echo "Gateway: ${{ env.REGISTRY }}/${{ github.repository }}/gateway:staging"
        echo "Identity API: ${{ env.REGISTRY }}/${{ github.repository }}/identity-api:staging"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Gateway
      uses: docker/build-push-action@v5
      with:
        context: .
        file: gateway/Zap.Gateway.Api/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ github.repository }}/gateway:${{ steps.version.outputs.VERSION }}
          ${{ env.REGISTRY }}/${{ github.repository }}/gateway:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and Push Identity API
      uses: docker/build-push-action@v5
      with:
        context: .
        file: services/Zap.Identity.Api/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ github.repository }}/identity-api:${{ steps.version.outputs.VERSION }}
          ${{ env.REGISTRY }}/${{ github.repository }}/identity-api:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Create GitHub Release
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: true
        body: |
          ## Docker Images
          - Gateway: `${{ env.REGISTRY }}/${{ github.repository }}/gateway:${{ steps.version.outputs.VERSION }}`
          - Identity API: `${{ env.REGISTRY }}/${{ github.repository }}/identity-api:${{ steps.version.outputs.VERSION }}`
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
